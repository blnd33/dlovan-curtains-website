<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" role="img" aria-label="Dlovan Curtain arched window mark">
  <!-- window frame -->
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 218 V100 A80 80 0 0 1 180 100 V218" stroke-width="5"/>
    <path d="M36 218 V100 A64 64 0 0 1 164 100 V218" stroke-width="3"/>
    <path d="M12 218 H188" stroke-width="5"/>
