    <path d="M47 106 C36 140 39 182 50 213"/>
    <path d="M64 114 C54 148 57 186 68 213"/>
    <path d="M153 106 C164 140 161 182 150 213"/>
    <path d="M136 114 C146 148 143 186 132 213"/>
